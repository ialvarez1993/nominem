services:
  nominatim:
    container_name: nominatim
    image: mediagis/nominatim:5.1
    ports:
      - "8080:8080"
    environment:
      # see https://github.com/mediagis/nominatim-docker/tree/master/4.5#configuration for more options
      # PBF_PATH: /nominatim/data/venezuela-latest.osm.pbf
      PBF_URL: https://download.geofabrik.de/south-america/venezuela-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/south-america/venezuela-updates/
      NOMINATIM_PASSWORD: volumes-undated-childhood-hemstitch-failing
      IMPORT_WIKIPEDIA: false
      THREADS: 4
    volumes:
       - type: bind
         source: ./data/db/postgresql
         target: /var/lib/postgresql/16/main
       - type: bind
         source: ./data/flatnode
         target: /nominatim/flatnode
       - type: bind
         source: ./data/osm
         target: /nominatim/data/
    shm_size: 2gb
    restart: always